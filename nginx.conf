# nginx.conf — reverse proxy for Floor555
# Place in /etc/nginx/sites-available/media-fetcher
# ln -s /etc/nginx/sites-available/media-fetcher /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Auth (optional — uncomment to protect with HTTP Basic Auth)
    # auth_basic           "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # Security headers (complement the app-level ones)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SSE — disable all buffering on the streaming endpoint
    location /api/job/ {
        proxy_pass             http://127.0.0.1:8000;
        proxy_http_version     1.1;
        proxy_set_header       Connection '';
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;
        chunked_transfer_encoding on;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }

    # Health endpoint (load balancer probe — no auth)
    location /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000/health;
    }

    # Static files with caching
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        expires 1h;
        add_header Cache-Control "public";
    }
}
